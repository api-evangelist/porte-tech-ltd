description: Porte Tech Ltd. is a hotel technology company based in Astana, Kazakhstan
  that offers a digital concierge platform to streamline guest experiences and reduce
  front-desk workload for hotels. Its product covers digital check-in and check-out,
  mobile room keys delivered via app, access codes or QR codes, Bluetooth lock upgrades
  that reuse existing hardware, an in-app guest experience for bookings and amenity
  ordering, integrations with spa, restaurant and laundry services, and a centralized
  management dashboard for property staff. Porte is a 500 Global portfolio company.
  No public API, SDK, or developer surface is currently published.
